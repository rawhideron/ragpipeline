<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Pipeline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #19202a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(1120px, calc(100vw - 32px)); margin: 0 auto; padding: 32px 0; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
      h1 { font-size: clamp(28px, 4vw, 44px); margin: 0; letter-spacing: 0; }
      .status { font-size: 14px; padding: 6px 10px; border: 1px solid #cdd5df; border-radius: 6px; background: white; }
      .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 18px; align-items: start; }
      section { background: white; border: 1px solid #d9dee7; border-radius: 8px; padding: 18px; box-shadow: 0 8px 24px rgba(28, 39, 54, 0.06); }
      h2 { margin: 0 0 14px; font-size: 18px; }
      label { display: block; font-weight: 650; margin: 14px 0 7px; }
      input[type="file"], input[type="url"], textarea { width: 100%; border: 1px solid #c8d0db; border-radius: 6px; padding: 10px; background: #fbfcfd; font: inherit; }
      textarea { min-height: 156px; resize: vertical; line-height: 1.45; }
      button { border: 0; border-radius: 6px; background: #176b87; color: white; padding: 10px 14px; font-weight: 700; cursor: pointer; margin-top: 12px; }
      button.secondary { background: #566579; }
      button.danger { background: #a73535; }
      button:disabled { background: #81909d; cursor: wait; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; background: #f2f5f7; border: 1px solid #dce2e8; border-radius: 6px; padding: 12px; min-height: 88px; }
      .stack { display: grid; gap: 18px; }
      .sources { display: grid; gap: 10px; }
      .source { border: 1px solid #dce2e8; border-radius: 6px; padding: 10px; background: #fbfcfd; }
      .source strong { display: block; margin-bottom: 6px; }
      .documents { display: grid; gap: 10px; }
      .document-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 1px solid #dce2e8; border-radius: 6px; padding: 10px; background: #fbfcfd; }
      .document-title { font-weight: 700; overflow-wrap: anywhere; }
      .document-meta { color: #566579; font-size: 13px; margin-top: 4px; overflow-wrap: anywhere; }
      @media (max-width: 820px) {
        header { align-items: flex-start; flex-direction: column; }
        .grid { grid-template-columns: 1fr; }
        .document-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>RAG Pipeline</h1>
        <div class="status" id="status">Ready</div>
      </header>

      <div class="grid">
        <div class="stack">
          <section>
            <h2>Upload</h2>
            <form id="uploadForm">
              <label for="document">Document</label>
              <input id="document" name="file" type="file" accept=".txt,.md,.pdf,text/plain,application/pdf" required />
              <button id="uploadButton" type="submit">Upload and Ingest</button>
            </form>
            <pre id="uploadResult">No document uploaded yet.</pre>
          </section>

          <section>
            <h2>Website</h2>
            <form id="urlForm">
              <label for="url">URL</label>
              <input id="url" name="url" type="url" placeholder="https://docs.python.org/3/" required />
              <button id="urlButton" type="submit">Ingest URL</button>
            </form>
            <pre id="urlResult">No URL ingested yet.</pre>
          </section>

          <section>
            <h2>Python Docs</h2>
            <form id="pythonDocsForm">
              <label for="pythonDocsUrl">Docs URL</label>
              <input id="pythonDocsUrl" name="url" type="url" value="https://docs.python.org/3/" required />
              <button id="pythonDocsButton" type="submit">Ingest Python Docs</button>
            </form>
            <pre id="pythonDocsResult">No docs bundle ingested yet.</pre>
          </section>

          <section>
            <h2>Documents</h2>
            <button id="refreshButton" class="secondary" type="button">Refresh</button>
            <div class="documents" id="documents"></div>
          </section>
        </div>

        <section>
          <h2>Ask</h2>
          <form id="queryForm">
            <label for="question">Question</label>
            <textarea id="question" required placeholder="Ask about the uploaded documents"></textarea>
            <button id="queryButton" type="submit">Ask Question</button>
          </form>
          <pre id="answer">No answer yet.</pre>
          <div class="sources" id="sources"></div>
        </section>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const uploadResult = document.getElementById("uploadResult");
      const urlResult = document.getElementById("urlResult");
      const pythonDocsResult = document.getElementById("pythonDocsResult");
      const answerEl = document.getElementById("answer");
      const sourcesEl = document.getElementById("sources");
      const documentsEl = document.getElementById("documents");

      function setStatus(label = "Ready") {
        statusEl.textContent = label;
      }

      function setBusy(button, busy, label) {
        button.disabled = busy;
        setStatus(busy ? label : "Ready");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function loadDocuments() {
        documentsEl.textContent = "Loading documents...";
        try {
          const response = await fetch("/api/documents");
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Could not load documents");
          documentsEl.innerHTML = "";
          if (!data.documents?.length) {
            documentsEl.textContent = "No documents ingested yet.";
            return;
          }
          for (const doc of data.documents) {
            const row = document.createElement("div");
            row.className = "document-row";
            row.innerHTML = `
              <div>
                <div class="document-title">${escapeHtml(doc.title || doc.document_id)}</div>
                <div class="document-meta">${escapeHtml(doc.source_uri || doc.filename || "")}</div>
                <div class="document-meta">${doc.chunks} chunks - ${escapeHtml(doc.document_id)}</div>
              </div>
              <button class="danger" type="button">Delete</button>
            `;
            row.querySelector("button").addEventListener("click", async () => {
              setStatus("Deleting");
              try {
                const response = await fetch(`/api/documents/${encodeURIComponent(doc.document_id)}`, { method: "DELETE" });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Delete failed");
                await loadDocuments();
              } catch (error) {
                setStatus(error.message);
              } finally {
                setTimeout(() => setStatus(), 1400);
              }
            });
            documentsEl.appendChild(row);
          }
        } catch (error) {
          documentsEl.textContent = error.message;
        }
      }

      async function pollIngestJob(jobId) {
        let done = false;
        while (!done) {
          const response = await fetch(`/api/ingest/jobs/${encodeURIComponent(jobId)}`);
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Could not load ingest job");
          pythonDocsResult.textContent = JSON.stringify(data, null, 2);
          done = ["completed", "failed"].includes(data.status);
          if (!done) {
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
        }
        await loadDocuments();
      }

      document.getElementById("uploadForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("uploadButton");
        const formData = new FormData(event.target);
        setBusy(button, true, "Ingesting");
        try {
          const response = await fetch("/api/ingest", { method: "POST", body: formData });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Upload failed");
          uploadResult.textContent = JSON.stringify(data, null, 2);
          await loadDocuments();
        } catch (error) {
          uploadResult.textContent = error.message;
        } finally {
          setBusy(button, false);
        }
      });

      document.getElementById("urlForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("urlButton");
        setBusy(button, true, "Ingesting URL");
        try {
          const response = await fetch("/api/ingest/url", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: document.getElementById("url").value, replace: true }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "URL ingest failed");
          urlResult.textContent = JSON.stringify(data, null, 2);
          await loadDocuments();
        } catch (error) {
          urlResult.textContent = error.message;
        } finally {
          setBusy(button, false);
        }
      });

      document.getElementById("pythonDocsForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("pythonDocsButton");
        setBusy(button, true, "Starting docs ingest");
        try {
          const response = await fetch("/api/ingest/docs/python", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: document.getElementById("pythonDocsUrl").value, replace: true }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Python docs ingest failed");
          pythonDocsResult.textContent = JSON.stringify(data, null, 2);
          setStatus("Ingesting docs");
          await pollIngestJob(data.job_id);
        } catch (error) {
          pythonDocsResult.textContent = error.message;
        } finally {
          setBusy(button, false);
        }
      });

      document.getElementById("queryForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("queryButton");
        sourcesEl.innerHTML = "";
        setBusy(button, true, "Thinking");
        try {
          const response = await fetch("/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: document.getElementById("question").value, top_k: 5 }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Query failed");
          answerEl.textContent = data.answer;
          for (const source of data.sources || []) {
            const item = document.createElement("div");
            item.className = "source";
            item.innerHTML = `<strong>${escapeHtml(source.title || source.filename || source.source_uri || "Document")} - chunk ${source.chunk_index}</strong><span>${escapeHtml(source.text || "")}</span>`;
            sourcesEl.appendChild(item);
          }
        } catch (error) {
          answerEl.textContent = error.message;
        } finally {
          setBusy(button, false);
        }
      });

      document.getElementById("refreshButton").addEventListener("click", loadDocuments);
      loadDocuments();
    </script>
  </body>
</html>
