name: SonarQube

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements*.txt

      # The scanner reads app/coverage.xml from this runner's workspace.
      - name: Run tests with coverage
        working-directory: app
        run: |
          pip install -r requirements.txt -r requirements-test.txt
          python -m pytest tests --cov=src --cov-report=xml:coverage.xml

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=ragpipeline
            -Dsonar.projectName=ragpipeline
            -Dsonar.sources=app/src,frontend
            -Dsonar.tests=app/tests
            -Dsonar.python.coverage.reportPaths=app/coverage.xml
            -Dsonar.python.version=3.12
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
