apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: api
          image: ghcr.io/rawhideron/ragpipeline-api:f5595820b700b00d6f3c209e211f86b710229798
          imagePullPolicy: IfNotPresent
          env:
            # Traces go to the OTel agent on this node, which forwards to Tempo
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: ingestion-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4317
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: health
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-llm-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: rag
spec:
  selector:
    app: ingestion-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
