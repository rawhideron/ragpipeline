apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rawhideron/ragpipeline-frontend:311c0e90d98b86c046d89daf7591f5b8c85a1766
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: rag
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
