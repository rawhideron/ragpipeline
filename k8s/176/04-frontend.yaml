apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rawhideron/ragpipeline-frontend:c87b735d3a7b238ab6607387a51f4d6a8ff03476
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: rag
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
