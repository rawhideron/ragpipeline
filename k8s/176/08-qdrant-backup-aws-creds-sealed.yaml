# AWS credentials for the qdrant-backup CronJob (07-qdrant-backup-cronjob.yaml):
# a key for the ragpipeline-backup IAM user, which can only list, get, put and
# delete objects in the ragpipeline-backups bucket. Sealed with host 176's
# sealed-secrets controller (kube-system/sealed-secrets), so only that cluster
# can decrypt it. To rotate, see "Qdrant Backups" in the README.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: qdrant-backup-aws-creds
  namespace: rag
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: qdrant-backup-aws-creds
      namespace: rag
    type: Opaque
