apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ragpipeline
  namespace: rag
  annotations:
    cert-manager.io/cluster-issuer: reunion-letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ragpipeline.duckdns.org
      secretName: ragpipeline-tls
  rules:
    - host: ragpipeline.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-oauth2-proxy
                port:
                  name: http
