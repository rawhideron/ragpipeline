# ragpipeline.duckdns.org on 230's Envoy Gateway (reunion-gateway, listener
# https-ragpipeline), which replaced ingress-nginx in
# rawhideron/goodman_reunion#764. Fields the API server would default are
# written out so ArgoCD doesn't report it OutOfSync. rag-oauth2-proxy does
# auth and proxying.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ragpipeline
  namespace: rag
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: reunion-gateway
      namespace: envoy-gateway-system
      sectionName: https-ragpipeline
  hostnames:
    - ragpipeline.duckdns.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: rag-oauth2-proxy
          port: 4180
          weight: 1
      # nginx has no total-time cap; Envoy's default is 15s for the whole
      # request (too short for LLM answers). The gateway's 60s idle timeout
      # matches nginx's default proxy-read-timeout.
      timeouts:
        request: 0s
