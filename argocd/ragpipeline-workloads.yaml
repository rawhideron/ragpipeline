apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ragpipeline-workloads
  namespace: argocd
spec:
  project: ragpipeline-project
  source:
    repoURL: https://github.com/rawhideron/ragpipeline
    targetRevision: main
    path: k8s/176
  destination:
    server: https://192.168.1.176:43087
    namespace: rag
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
